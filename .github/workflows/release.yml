name: Release

# Push a tag like v1.1.0 (matching the VERSION file) and this builds,
# signs, notarizes, and publishes the DMG + zip + checksums.
#
# Required repository secrets:
#   MAC_CERT_P12         base64 of the Developer ID Application .p12
#   MAC_CERT_PASSPHRASE  passphrase of that .p12
#   NOTARY_KEY_P8        contents of the App Store Connect API key (.p8)
#   NOTARY_KEY_ID        the API key's ID
#   NOTARY_ISSUER        the App Store Connect issuer UUID

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # BUILD_NUMBER = git rev-list --count

      - name: Verify tag matches VERSION
        run: |
          VERSION=$(cat VERSION)
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$VERSION" != "$TAG" ]; then
            echo "Tag v$TAG does not match VERSION file ($VERSION)" >&2
            exit 1
          fi

      - name: Test
        run: swift test

      - name: Import signing certificate
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSPHRASE: ${{ secrets.MAC_CERT_PASSPHRASE }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PW=$(uuidgen)
          echo "$MAC_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$MAC_CERT_PASSPHRASE" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PW" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          rm "$RUNNER_TEMP/cert.p12"

      - name: Install notary key
        env:
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s' "$NOTARY_KEY_P8" \
            > "$HOME/.appstoreconnect/private_keys/AuthKey_${{ secrets.NOTARY_KEY_ID }}.p8"

      - name: Build, sign, notarize, package
        run: make release ISSUER="${{ secrets.NOTARY_ISSUER }}"

      - name: Extract changelog section
        run: |
          VERSION=$(cat VERSION)
          awk -v ver="$VERSION" '
            $0 ~ "^## " ver { found=1; next }
            found && /^## / { exit }
            found { print }' CHANGELOG.md > dist/release-notes.md
          if [ ! -s dist/release-notes.md ]; then
            echo "Release $VERSION." > dist/release-notes.md
          fi

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(cat VERSION)
          gh release create "v$VERSION" \
            --title "Hubby $VERSION" \
            --notes-file dist/release-notes.md \
            "dist/Hubby-$VERSION.dmg" "dist/Hubby-$VERSION.zip" dist/checksums.txt
